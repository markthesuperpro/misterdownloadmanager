
name: Refresh Orphan Branch

on:
  schedule:
    - cron: "13 17 * * *"

  workflow_dispatch:
    inputs:
      make_orphan:
        description: "One-time: disconnect the branch while preserving its files"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: orphan-branch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check and refresh orphan commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ORPHAN_BRANCH
          MAKE_ORPHAN: ${{ inputs.make_orphan || false }}

        run: |
          set -euo pipefail

          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          git init --bare "$TMP_DIR/repo.git" >/dev/null
          cd "$TMP_DIR/repo.git"

          REMOTE="https://github.com/${GITHUB_REPOSITORY}.git"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"

          git remote add origin "$REMOTE"

          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none

          git fetch \
            --no-tags \
            --depth=1 \
            --filter=blob:none \
            origin "refs/heads/${TARGET_BRANCH}"

          OLD_SHA="$(git rev-parse FETCH_HEAD)"
          TREE_SHA="$(git show -s --format=%T "$OLD_SHA")"

          LAST_COMMIT="$(git show -s --format=%ct "$OLD_SHA")"
          NOW="$(date -u +%s)"

          INTERVAL=$((50 * 24 * 60 * 60))

          create_amended_root() {
            local source_sha="$1"
            local author_name author_email author_date message_file

            author_name="$(git show -s --format=%an "$source_sha")"
            author_email="$(git show -s --format=%ae "$source_sha")"
            author_date="$(git show -s --format=%aI "$source_sha")"

            message_file="$TMP_DIR/commit-message"
            git show -s --format=%B "$source_sha" > "$message_file"

            GIT_AUTHOR_NAME="$author_name" \
            GIT_AUTHOR_EMAIL="$author_email" \
            GIT_AUTHOR_DATE="$author_date" \
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
              git commit-tree "$TREE_SHA" -F "$message_file"
          }

          HAS_PARENT=false

          if git cat-file -p "$OLD_SHA" | grep -q '^parent '; then
            HAS_PARENT=true
          fi

          if [[ "$HAS_PARENT" == "true" ]]; then
            if [[ "$MAKE_ORPHAN" != "true" ]]; then
              echo "::error::Branch is not orphaned. Run manually once with make_orphan checked."
              exit 1
            fi

            echo "Creating disconnected root commit..."

            NEW_SHA="$(create_amended_root "$OLD_SHA")"

            git push \
              --force-with-lease="refs/heads/${TARGET_BRANCH}:${OLD_SHA}" \
              origin "${NEW_SHA}:refs/heads/${TARGET_BRANCH}"

            echo "Orphan initialized. The 50-day interval starts now."
            exit 0
          fi

          if (( NOW - LAST_COMMIT < INTERVAL )); then
            echo "Not due yet. Skipping."
            exit 0
          fi

          echo "50 days elapsed. Amending orphan commit..."

          NEW_SHA="$(create_amended_root "$OLD_SHA")"

          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${OLD_SHA}" \
            origin "${NEW_SHA}:refs/heads/${TARGET_BRANCH}"

          echo "Updated ${TARGET_BRANCH}: ${OLD_SHA} -> ${NEW_SHA}"
